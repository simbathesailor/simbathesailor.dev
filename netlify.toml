[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# One old post folder had a trailing space in its name.
[[redirects]]
  from = "/useismounted-ref-vs-state-approach%20/*"
  to = "/useismounted-ref-vs-state-approach/"
  status = 301

[[redirects]]
  from = "/useismounted-ref-vs-state-approach /*"
  to = "/useismounted-ref-vs-state-approach/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
